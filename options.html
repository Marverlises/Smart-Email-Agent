<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Email Reply 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand">Smart Email Reply</div>
      <h1>连接你的 LLM API</h1>
      <p>插件读取当前 Gmail 或 Outlook 页面已经加载的完整会话历史，不需要配置或授权邮箱账户，也不会自动发送邮件。</p>
    </header>

    <form id="settings-form">
      <section class="card">
        <div class="section-title">
          <div><span class="step">1</span><h2>LLM API 连接</h2></div>
          <span class="badge">OpenAI-compatible</span>
        </div>
        <label class="field full">
          <span>API 基础地址或完整 chat/completions 地址</span>
          <input id="apiBaseUrl" name="apiBaseUrl" type="url" autocomplete="url" required placeholder="https://api.example.com/v1">
          <small>若填写基础地址，插件会自动追加 /chat/completions。保存时只申请该域名的访问权限。</small>
        </label>
        <div class="grid two">
          <label class="field"><span>模型</span><input id="model" name="model" type="text" required placeholder="gpt-4.1-mini"></label>
          <label class="field">
            <span>API Key（本地保存）</span>
            <div class="secret-wrap"><input id="apiKey" name="apiKey" type="password" autocomplete="off" placeholder="sk-…；本地模型可留空"><button id="toggle-key" class="text-button" type="button">显示</button></div>
          </label>
        </div>
        <details>
          <summary>高级鉴权</summary>
          <div class="grid two details-grid">
            <label class="field"><span>Key 请求头</span><input id="apiKeyHeader" name="apiKeyHeader" type="text" placeholder="Authorization"></label>
            <label class="field"><span>Key 前缀</span><input id="apiKeyPrefix" name="apiKeyPrefix" type="text" placeholder="Bearer"><small>若服务商不需要前缀，可留空。</small></label>
          </div>
        </details>
      </section>

      <section class="card">
        <div class="section-title"><div><span class="step">2</span><h2>生成偏好</h2></div></div>
        <div class="grid three">
          <label class="field"><span>建议数量</span><input id="suggestionCount" name="suggestionCount" type="number" min="2" max="6" step="1"></label>
          <label class="field">
            <span>输出语言</span>
            <select id="language" name="language">
              <option value="auto">跟随对方语言</option>
              <option value="zh">简体中文</option>
              <option value="en">English</option>
              <option value="bilingual">中英双语</option>
            </select>
          </label>
          <label class="field"><span>随机度</span><input id="temperature" name="temperature" type="number" min="0" max="2" step="0.1"></label>
        </div>
        <label class="field full"><span>语气与风格</span><textarea id="toneGuidance" name="toneGuidance" rows="3" placeholder="例如：专业、友好、简洁；重要数字不要改写。"></textarea></label>
      </section>

      <section class="card">
        <div class="section-title"><div><span class="step">3</span><h2>当前会话历史范围</h2></div></div>
        <div class="grid two">
          <label class="field"><span>最多消息数</span><input id="maxThreadMessages" name="maxThreadMessages" type="number" min="0" max="500" step="1"><small>0 表示读取当前页面识别到的全部消息。</small></label>
          <label class="field"><span>单条消息正文字符上限</span><input id="messageBodyChars" name="messageBodyChars" type="number" min="500" max="30000" step="500"></label>
          <label class="field"><span>最近保留全文的消息数</span><input id="recentFullMessages" name="recentFullMessages" type="number" min="3" max="40" step="1"></label>
          <label class="field"><span>最终上下文最大字符数</span><input id="maxContextChars" name="maxContextChars" type="number" min="4000" max="60000" step="1000"><small>超出时会先分批摘要较早消息。</small></label>
        </div>
        <div class="notice">
          <strong>数据范围</strong>
          <p>插件只读取当前邮件页面已经加载到 DOM 的会话内容，不访问邮箱 API、不跨线程搜索，也不需要 Microsoft 或 Google 授权。当前会话文本会发送到你配置的 LLM API。</p>
        </div>
      </section>

      <div class="actions">
        <button id="reset" class="button secondary" type="button">恢复默认</button>
        <div class="spacer"></div>
        <button id="test" class="button secondary" type="button">测试连接</button>
        <button class="button primary" type="submit">保存设置</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
